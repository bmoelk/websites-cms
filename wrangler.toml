name = "brainendeavor-slottd-cms"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Dedicated SlottD D1 Database
[[d1_databases]]
binding = "DB"
database_name = "brainendeavor-slottd-db"
database_id = "local-slottd-db-id"
migrations_dir = "./migrations"

# Reused R2 Bucket for Media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "brainendeavor-cms-media"

# Configurable Scheduled Release Cron Trigger (Default: Hourly)
[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "development"
STAGING_URL = "https://brainendeavor-staging.pages.dev"
PRODUCTION_URL = "https://brainendeavor.com"
# Production & staging deploy hook URLs should be provided via wrangler.overrides.toml or Cloudflare KMS
# STAGING_DEPLOY_HOOK_URL = "https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/..."
# PRODUCTION_DEPLOY_HOOK_URL = "https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/..."

